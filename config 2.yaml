# ===== Marbles OP AH Abilities - config =====
# Durations are in seconds, damage in hearts (1 heart = 2 HP), ranges/radius in blocks.
# Levels are potion levels (1 = level I). Use /marbles reload after editing.

# ---- Energy ----
start-energy: 3
max-energy: 10
kill-energy-gain: 1
death-energy-loss: 1
deathban-energy: -5
deathban-minutes: 1440        # 0 = permanent
unlock-ability-1: 3           # energy needed for F
unlock-ability-2: 5           # energy needed for Shift+F
passive-min-energy: 0         # passive works at or above this
withdraw-min-energy: 0        # /withdraw can't take you below this

# ---- Global combat rules ----
damage-cap-hearts: 4          # max true damage one activation can do to one target
crowd-control:
  boss-duration-multiplier: 0.5
  immunity-seconds: 4         # after being immobilized you can't be immobilized again for this long

# ---- Items ----
items:
  material: PLAYER_HEAD       # base item of Energy Marble / Reroller / Trader
  use-custom-model: true      # needs the resource pack (otherwise they look like a normal head)

join-animation:
  enabled: true
  every-join: true          # false = only the very first join
  play-on-reroll: true
  start-delay-ticks: 20

reroll:
  avoid-same: true            # reroll can't give you your current element
  reset-cooldowns: true

trader:
  title: "Marble Trader"
  consume-on-use: false       # true = the Trader item is used up when opened
  # result: energy | reroller | trader | any MATERIAL name.  max-uses is per opening.
  trades:
    - result: energy
      amount: 1
      max-uses: 3
      cost:
        - {item: DIAMOND_BLOCK, amount: 6}
    - result: reroller
      amount: 1
      max-uses: 2
      cost:
        - {item: NETHERITE_INGOT, amount: 1}
        - {item: DIAMOND_BLOCK, amount: 4}
    - result: GOLDEN_APPLE
      amount: 2
      max-uses: 5
      cost:
        - {item: GOLD_BLOCK, amount: 4}
    - result: ENCHANTED_GOLDEN_APPLE
      amount: 1
      max-uses: 1
      cost:
        - {item: EMERALD_BLOCK, amount: 16}

# ---- Abilities ----
abilities:
  fire:
    inferno:        {cooldown: 35, radius: 10, damage: 4, fire-seconds: 3}
    flame-dash:     {cooldown: 20, distance: 12, damage: 2}
    passive:        {fire-immunity: true, ignite-chance: 0.15, ignite-seconds: 2}
  water:
    tsunami:        {cooldown: 35, range: 20, width: 3.2, damage: 3, pull-strength: 1.1}
    whirlpool:      {cooldown: 30, range: 15, radius: 7, duration: 3, pull-strength: 0.45}
    passive:        {water-breathing: true, dolphins-grace-level: 1}
  lightning:
    thunderbolt:    {cooldown: 30, range: 25, damage: 4}
    chain-lightning: {cooldown: 40, targets: 4, range: 20, jump-range: 10, damage: 2, delay-ticks: 4}
    passive:        {speed-level: 1, hits-required: 8, internal-cooldown: 12, damage: 1}
  earth:
    earthquake:     {cooldown: 40, radius: 10, damage: 4, launch: 1.0}
    stone-prison:   {cooldown: 35, range: 15, duration: 3, block: STONE}
    passive:        {resistance-level: 1, knockback-reduction: 0.5}
  ice:
    glacial-burst:  {cooldown: 35, radius: 8, damage: 3, slowness-level: 4, slowness-seconds: 3}
    piercing-icicle: {cooldown: 25, range: 25, damage: 4, weakness-level: 2, weakness-seconds: 4}
    passive:        {resistance-level: 1, resistance-seconds: 3, internal-cooldown: 15}
  wind:
    cyclone:        {cooldown: 35, range: 15, radius: 4.5, duration: 3, damage: 3, lift: 0.8}
    gale-strike:    {cooldown: 20, distance: 15, damage: 2, knockback: 0.8}
    passive:        {speed-level: 2, fall-immunity: true}
  void:
    event-horizon:  {cooldown: 45, range: 20, pull-radius: 8, pull-seconds: 2, pull-strength: 0.4, explosion-radius: 6, damage: 4}
    riftwalk:       {cooldown: 30, range: 15, blindness-seconds: 2, bonus-window-seconds: 3, bonus-damage: 2}
    passive:        {night-vision: true, blindness-immunity: true}
  nature:
    worldroot:      {cooldown: 35, radius: 8, duration: 3, damage: 2}
    rebirth:        {cooldown: 60, heal-hearts: 6, leech-seconds: 5, leech-percent: 0.25, leech-cap-hearts: 2}
    passive:        {threshold-hearts: 5, regen-level: 2, regen-seconds: 3, internal-cooldown: 30}
  light:
    divine-smite:   {cooldown: 35, range: 20, damage: 4}
    flashbang:      {cooldown: 40, radius: 10, blind-seconds: 3, disable-seconds: 3}
    passive:        {night-vision: true, damage-multiplier: 1.15}
  magma:
    eruption:       {cooldown: 40, range: 20, radius: 6, damage: 4, launch: 0.8}
    molten-prison:  {cooldown: 30, range: 15, duration: 2, damage: 2}
    passive:        {fire-immunity: true, strength-level: 1, strength-seconds: 2, internal-cooldown: 10}
