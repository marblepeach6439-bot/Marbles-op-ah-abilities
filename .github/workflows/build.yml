name: Build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn -B package
      - uses: actions/upload-artifact@v4
        with:
          name: MarblesOPAHAbilities
          path: target/MarblesOPAHAbilities.jar
      - run: cd resourcepack && zip -r ../MarblesOPAH-ResourcePack.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: ResourcePack
          path: MarblesOPAH-ResourcePack.zip
